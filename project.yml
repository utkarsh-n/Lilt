name: Lilt
options:
  bundleIdPrefix: com.utkarsh
  deploymentTarget:
    iOS: "27.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
packages:
  LiltCore:
    path: .
  OfflineIntelligenceKit:
    path: ../OfflineIntelligenceKit
  OfflineIntelligenceMLX:
    path: ../OfflineIntelligenceKit/MLX
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "4"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Lilt:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["**/*.metal", "Resources/Models"]
      - path: App/Resources/Models
        type: folder
        buildPhase: resources
      - path: App/Rendering/Board.metal
        buildPhase: resources
    dependencies:
      - package: LiltCore
        product: LiltCore
      - package: OfflineIntelligenceKit
        product: OfflineIntelligence
      - package: OfflineIntelligenceMLX
        product: OfflineIntelligenceMLX
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Lilt
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMotionUsageDescription: "Lilt uses device motion to roll the marble when you tilt your iPhone."
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.games
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.utkarsh.lilt
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MTL_FAST_MATH: YES
        CODE_SIGN_ENTITLEMENTS: App/Lilt.entitlements
    entitlements:
      path: App/Lilt.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
schemes:
  Lilt:
    build:
      targets:
        Lilt: all
